name: "🐛 Bug Report"
description: "File an issue about broken functionality or unexpected errors in ReviewBot."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or webhook payload to reproduce the behavior.
      placeholder: |
        1. Start ReviewBot with configuration...
        2. Trigger webhook event...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Paste any error traces or relevant console logs.
      render: shell
